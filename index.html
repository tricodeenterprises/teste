<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Vendas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Sistema de Vendas</h1>
    <nav>
      <button id="tab-produtos" class="tab active">Produtos</button>
      <button id="tab-vendas" class="tab">Vendas</button>
      <button id="tab-historico" class="tab">Histórico</button>
    </nav>
  </header>

  <main>
    <!-- Seção Produtos -->
    <section id="section-produtos" class="section active">
      <h2>Cadastro de Produtos</h2>
      <form id="form-produto">
        <input type="text" id="produto-nome" placeholder="Nome do produto" required>
        <input type="number" id="produto-preco" placeholder="Preço" step="0.01" min="0.01" required>
        <input type="number" id="produto-estoque" placeholder="Estoque" min="0" required>
        <button type="submit">Adicionar Produto</button>
      </form>
      <div id="lista-produtos"></div>
    </section>

    <!-- Seção Vendas -->
    <section id="section-vendas" class="section">
      <h2>Nova Venda</h2>
      <div class="venda-container">
        <div class="produtos-disponiveis">
          <h3>Produtos Disponíveis</h3>
          <div id="produtos-venda"></div>
        </div>
        <div class="carrinho">
          <h3>Carrinho</h3>
          <div id="carrinho-itens"></div>
          <div class="total">Total: R$ <span id="carrinho-total">0,00</span></div>
          <button id="finalizar-venda" disabled>Finalizar Venda</button>
        </div>
      </div>
    </section>

    <!-- Seção Histórico -->
    <section id="section-historico" class="section">
      <h2>Histórico de Vendas</h2>
      <div id="historico-vendas"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
