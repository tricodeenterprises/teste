<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Meu Projeto</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema">
        🌙 Modo Escuro
      </button>
    </header>
    <main>
      <div class="card">
        <h2>Bem-vindo</h2>
        <p>Este é um exemplo de página com suporte a dark mode usando CSS variables. Clique no botão acima para alternar entre os temas claro e escuro. Sua preferência é salva automaticamente.</p>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
